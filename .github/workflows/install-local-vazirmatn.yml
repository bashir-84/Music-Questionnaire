name: Install local Vazirmatn font (one-time)
on:
  push:
    paths:
      - '.github/workflows/install-local-vazirmatn.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download official Vazirmatn 33.003 webfont and license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p landing-2/assets/fonts
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2' \
            -o landing-2/assets/fonts/Vazirmatn-Variable.woff2
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 30 \
            'https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt' \
            -o landing-2/assets/fonts/OFL.txt
          test "$(wc -c < landing-2/assets/fonts/Vazirmatn-Variable.woff2)" -gt 40000
          python - <<'PY'
          from pathlib import Path
          p=Path('landing-2/assets/fonts/Vazirmatn-Variable.woff2')
          assert p.read_bytes()[:4] == b'wOF2', 'Webfont is not WOFF2'
          PY
      - name: Use locally hosted font, without external CSS requests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('landing-2/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<link rel="preconnect" href="https://cdn\.jsdelivr\.net" crossorigin\s*/>', '', s)
          s=re.sub(r'\s*<link rel="stylesheet" href="https://cdn\.jsdelivr\.net/npm/vazir-font@30\.1\.0/dist/font-face\.css"\s*/>', '', s)
          assert 'cdn.jsdelivr.net' not in s, 'External font link still present'
          preload='<link rel="preload" href="./assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />'
          if preload not in s:
              s=s.replace('<style>',preload+'\n<style>',1)
          face="@font-face{font-family:'Vazirmatn';src:url('./assets/fonts/Vazirmatn-Variable.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}"
          if face not in s:
              s=s.replace('<style>', '<style>\n'+face+'\n',1)
          s=s.replace("font-family:'Vazir','Vazirmatn',Tahoma,Arial,sans-serif", "font-family:'Vazirmatn',Tahoma,Arial,sans-serif")
          s=s.replace('font-family:Vazir,Tahoma,sans-serif','font-family:Vazirmatn,Tahoma,sans-serif')
          s=s.replace('font-family:Vazir,','font-family:Vazirmatn,')
          assert "font-family:'Vazirmatn',Tahoma,Arial,sans-serif" in s
          assert s.count('Vazirmatn-Variable.woff2') == 2
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit vendor font and website update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing-2/index.html landing-2/assets/fonts/
          git diff --cached --check
          git commit -m 'Host Vazirmatn locally as single variable WOFF2 font'
          git push origin HEAD:main
